<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Where the Holes Aren’t</title>
<meta name="description" content="A short interactive film about the bullet holes nobody counted: Abraham Wald, 1943, and the planes that didn’t come home. Every frame is drawn live by code.">
<meta name="theme-color" content="#000000">
<link rel="icon" href="data:,">
<style>
  :root {
    --paper: #f3eee4; --ink: #1b1915; --gold: #d9b26a; --dim: rgba(243, 238, 228, .62); --faint: rgba(243, 238, 228, .38);
    --serif: "Iowan Old Style", "Hoefler Text", Baskerville, Georgia, serif;
    --fw: 100vw; --fh: 41.8vw; --open: 0;
  }
  * { box-sizing: border-box; }
  html, body { margin: 0; height: 100%; background: #000; color: var(--paper); font-family: var(--serif); overflow: hidden; }
  body { display: grid; grid-template-rows: 1fr auto 1fr; justify-items: center; -webkit-font-smoothing: antialiased; }
  [hidden] { display: none !important; }
  .bar { width: 100%; display: flex; padding: 0 clamp(16px, 3vw, 40px); }
  .bar.top { align-items: flex-end; justify-content: space-between; padding-bottom: 10px; }
  .bar.bottom { flex-direction: column; align-items: center; justify-content: flex-start; padding-top: 14px; gap: 12px; }
  #chapter { font-style: italic; font-size: 15px; color: var(--faint); letter-spacing: .01em; min-height: 1.2em; }
  #sound { font: italic 14px var(--serif); color: var(--faint); background: none; border: 0; padding: 6px 0; cursor: pointer; }
  #sound:hover { color: var(--paper); }

  #frame { position: relative; width: var(--fw); height: var(--fh); overflow: hidden;
    clip-path: inset(calc(50% * (1 - var(--open))) 0); transition: clip-path 1.8s cubic-bezier(.65, 0, .25, 1); }
  #c { position: absolute; inset: 0; width: 100%; height: 100%; display: block; }
  #frame.pointer { cursor: pointer; }
  #frame.aim { cursor: crosshair; }

  /* words: set above the horizon, like titles in a film */
  #words { position: absolute; inset: 0; pointer-events: none; }
  .w { position: absolute; left: 0; right: 0; top: 40%; text-align: center; font-size: clamp(24px, 3.2vw, 56px); line-height: 1.12;
    letter-spacing: -.005em; color: var(--paper); text-shadow: 0 0 28px rgba(0, 0, 0, .45); opacity: 0; will-change: opacity, filter, transform; padding: 0 6%;
    transition: color .3s, text-shadow .3s; }
  .w.dark { color: var(--ink); text-shadow: 0 0 22px rgba(255, 250, 240, .35); }
  .w.big { font-size: clamp(34px, 5.4vw, 92px); letter-spacing: -.015em; }
  .w.mid { top: 50%; transform: translateY(-50%); }
  .w.low { top: auto; bottom: 12%; }
  .w.high { top: 16%; }
  .w.top { top: 4.5%; }
  .w.small { font-size: clamp(18px, 1.9vw, 30px); font-style: italic; }
  .w.gold { color: var(--gold); }

  /* numbers pinned to the drawing */
  #labels { position: absolute; inset: 0; pointer-events: none; }
  .lab { position: absolute; transform: translate(-50%, -100%); text-align: center; white-space: nowrap; opacity: 0; transition: opacity .8s; }
  .lab.on { opacity: 1; }
  .lab b { display: block; font-weight: 400; font-size: clamp(22px, 2.6vw, 44px); line-height: 1; color: var(--paper); text-shadow: 0 0 18px rgba(0, 0, 0, .6); }
  .lab span { display: block; font-style: italic; font-size: clamp(12px, 1.05vw, 16px); color: var(--dim); margin-top: 4px; text-shadow: 0 0 12px rgba(0, 0, 0, .8); }
  .lab i { display: block; width: 1px; height: 18px; margin: 6px auto 0; background: rgba(243, 238, 228, .45); }
  .lab.below { transform: translate(-50%, 0); }
  .lab.below i { margin: 0 auto 6px; }
  .lab.gold b { color: var(--gold); }
  .lab.big b { font-size: clamp(34px, 4.4vw, 76px); }
  .lab.title b { font-size: clamp(17px, 1.6vw, 26px); font-style: italic; }
  .lab.title span { white-space: normal; width: 22em; margin: 6px auto 0; line-height: 1.4; }

  #sub { margin: 0; max-width: 62ch; text-align: center; font-style: italic; font-size: clamp(15px, 1.25vw, 19px); line-height: 1.45; color: var(--dim); min-height: 1.45em; transition: opacity .5s; }
  #ui { display: flex; flex-wrap: wrap; gap: 10px 14px; justify-content: center; min-height: 44px; }
  #ui button { font: 17px var(--serif); color: var(--paper); background: transparent; border: 1px solid rgba(243, 238, 228, .38);
    padding: 10px 22px; border-radius: 2px; cursor: pointer; transition: border-color .25s, background .25s, color .25s; animation: rise .7s both; }
  #ui button:hover { border-color: var(--gold); background: rgba(217, 178, 106, .08); }
  #ui button.primary { border-color: var(--gold); color: var(--gold); }
  #ui button:disabled { opacity: .6; cursor: progress; border-color: rgba(243, 238, 228, .2); color: var(--dim); }
  #ui button:focus-visible, #sound:focus-visible { outline: 2px solid var(--gold); outline-offset: 3px; }
  #ui button.hold { position: relative; padding-left: 52px; }
  #ui button.hold svg { position: absolute; left: 14px; top: 50%; width: 26px; height: 26px; margin-top: -13px; transform: rotate(-90deg); }
  #ui button.hold circle { fill: none; stroke-width: 2.5; }
  #ui button.hold .track { stroke: rgba(243, 238, 228, .2); }
  #ui button.hold .fill { stroke: var(--gold); stroke-dasharray: 69.1; stroke-dashoffset: calc(69.1 * (1 - var(--k, 0))); }
  @keyframes rise { from { opacity: 0; transform: translateY(6px); } }
  /* a decision lands: gold rings ripple out from where it happened */
  .ring { position: absolute; width: 140px; height: 140px; margin: -70px 0 0 -70px; border-radius: 50%; pointer-events: none;
    border: 1.5px solid var(--gold); box-shadow: 0 0 26px rgba(217, 178, 106, .55), inset 0 0 26px rgba(217, 178, 106, .35);
    animation: ring 1.6s cubic-bezier(.15, .7, .2, 1) forwards; }
  .ring.soft { border-color: rgba(243, 238, 228, .7); box-shadow: 0 0 30px rgba(243, 238, 228, .35); }
  @keyframes ring { from { transform: scale(.12); opacity: 1; } to { transform: scale(3.4); opacity: 0; } }

  /* the credits: the film's own source code, rolling */
  #roll { position: absolute; inset: 0; overflow: hidden; pointer-events: none; opacity: 0; transition: opacity 2s; }
  #roll.on { opacity: 1; }
  #roll pre { position: absolute; left: 6%; right: 6%; margin: 0; font: 11px/1.5 Menlo, "SF Mono", monospace; color: rgba(217, 178, 106, .22); white-space: pre-wrap; will-change: transform; }
  #roll .credits { position: absolute; inset: 0; display: grid; place-content: center; text-align: center; gap: 18px; }
  #roll .credits p { margin: 0; font-size: clamp(16px, 1.6vw, 26px); color: var(--paper); text-shadow: 0 0 30px #000, 0 0 12px #000; }
  #roll .credits p small { display: block; font-style: italic; font-size: .72em; color: var(--dim); margin-top: 4px; }

  #fail { position: fixed; inset: 0; display: grid; place-content: center; text-align: center; padding: 24px; background: #000; }
  #fail pre { max-width: 90vw; overflow: auto; text-align: left; font: 12px/1.4 Menlo, monospace; color: #ff9d8a; }
  .sr { position: absolute; width: 1px; height: 1px; overflow: hidden; clip: rect(0 0 0 0); white-space: nowrap; }

  @media (prefers-reduced-motion: reduce) { #frame { transition: none; } #ui button { animation: none; } .ring { display: none; } }
</style>
</head>
<body>
  <div class="bar top"><span id="chapter"></span><button id="sound" type="button" aria-pressed="true">Sound on</button></div>
  <div id="frame" role="img" aria-label="The film">
    <canvas id="c"></canvas>
    <div id="labels"></div>
    <div id="words" aria-hidden="true"><div class="w big mid" style="opacity:1">Where the holes aren’t</div></div>
    <div id="roll"><pre></pre><div class="credits"></div></div>
  </div>
  <div class="bar bottom"><p id="sub"></p><div id="ui"></div></div>
  <p id="transcript" class="sr" aria-live="polite"></p>
  <div id="fail" hidden><p>This film needs a browser with WebGL2.</p><pre></pre></div>
  <noscript><p style="position:fixed;inset:0;display:grid;place-content:center">This film is drawn by JavaScript. Please enable it.</p></noscript>

  <script src="model.js"></script>
  <script src="glsl-common.js"></script>
  <script src="engine.js"></script>
  <script src="media-core.js"></script>
  <script src="media-a.js"></script>
  <script src="media-b.js"></script>
  <script src="scene-sky.js"></script>
  <script src="scene-field.js"></script>
  <script src="audio.js"></script>
  <script src="film.js"></script>
</body>
</html>
